openvidu:
  analytics:
    enabled: true
    mongo_url: mongodb://mongoadmin:mongopassword@localhost:27017/?replicaSet=rs0&readPreference=primaryPreferred
    database: openvidu
    interval: 10s
    fixer_interval: 60s
    retention:
      events: 168h
      stats: 168h
      tracks: 168h
      entities: 2160h
      rollups_hourly: 9600h
    stats_detail: participant
    anonymize_ip: false
    store_metadata: false
    events:
      store_types:
        - ROOM_CREATED
        - ROOM_ENDED
        - PARTICIPANT_JOINED
        - PARTICIPANT_ACTIVE
        - PARTICIPANT_LEFT
        - PARTICIPANT_CONNECTION_ABORTED
        - EGRESS_STARTED
        - EGRESS_ENDED
    queue:
      max_events: 20000
      max_stats: 50000
    validation_action: warn
