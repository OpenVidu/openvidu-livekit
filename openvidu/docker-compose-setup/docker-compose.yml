services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - 6379:6379
      - 8001:8001

  egress:
    image: docker.io/livekit/egress:latest
    container_name: egress
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
    depends_on:
      redis:
        condition: service_started

  ingress:
    image: docker.io/livekit/ingress:latest
    container_name: ingress
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 1935:1935
      - 8085:8085
      - 7895:7895/udp
    environment:
      - INGRESS_CONFIG_FILE=/etc/ingress.yaml
    volumes:
      - ./ingress.yaml:/etc/ingress.yaml
    depends_on:
      redis:
        condition: service_started

  minio:
    image: docker.io/bitnami/minio:latest
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DEFAULT_BUCKETS=openvidu

  mongo:
    image: docker.io/bitnami/mongodb:latest
    container_name: mongo
    ports:
      - 27017:27017
    environment:
      - MONGODB_ADVERTISED_HOSTNAME=localhost
      - MONGODB_REPLICA_SET_MODE=primary
      - MONGODB_REPLICA_SET_NAME=rs0
      - ALLOW_EMPTY_PASSWORD=yes

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    network_mode: host
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://localhost:27017/?replicaSet=rs0&readPreference=primaryPreferred
    depends_on:
      mongo:
        condition: service_started

  redis-insight-init:
    image: cplan/alpine-bash-curl-jq:1.0.0
    container_name: redis-insight-init
    restart: on-failure
    network_mode: host
    entrypoint: []
    command: [
        "/bin/bash",
        "-c",
        "until $$(curl --output /dev/null --insecure --silent --head --fail localhost:8001/api/databases); do echo 'Waiting for Redis Insight...' && sleep 1; done; \
        curl --location --request PATCH 'localhost:8001/api/settings/' --header 'Content-Type: application/json' \
        --data-raw '{\"agreements\":{\"analytics\":false,\"notifications\":false,\"encryption\":false,\"eula\":true}}'; \
        echo '\n\n---------------------------'; \
        echo 'Redis Insight EULA accepted'; \
        echo '---------------------------\n';",
      ]
    depends_on:
      redis:
        condition: service_started
