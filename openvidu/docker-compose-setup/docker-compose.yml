services:
  redis:
    image: redis/redis-stack:7.4.0-v1
    container_name: redis
    ports:
      - 6379:6379
      - 8001:8001
    volumes:
      - redis:/data

  egress:
    image: docker.io/livekit/egress:latest
    container_name: egress
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
    depends_on:
      - redis

  ingress:
    image: docker.io/livekit/ingress:latest
    container_name: ingress
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 1935:1935
      - 8085:8085
      - 7895:7895/udp
    environment:
      - INGRESS_CONFIG_FILE=/etc/ingress.yaml
    volumes:
      - ./ingress.yaml:/etc/ingress.yaml
    depends_on:
      - redis

  mongo:
    image: docker.io/bitnami/mongodb:8.0.3
    container_name: mongo
    ports:
      - 27017:27017
    environment:
      - MONGODB_ADVERTISED_HOSTNAME=mongo
      - MONGODB_REPLICA_SET_MODE=primary
      - MONGODB_REPLICA_SET_NAME=rs0
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - mongo-db:/bitnami/mongodb

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/?replicaSet=rs0&readPreference=primaryPreferred
    depends_on:
      - mongo
    ports:
      - 8081:8081

volumes:
  redis:
  mongo-configdb:
  mongo-db:
