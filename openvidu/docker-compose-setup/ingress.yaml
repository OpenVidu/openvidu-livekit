redis:
  address: host.docker.internal:6379
  username: ""
  password: redispassword
  db: 0
  use_tls: false

api_key: devkey
api_secret: secret
ws_url: ws://host.docker.internal:7880
rtmp_port: 1935
whip_port: 8085
http_relay_port: 9090
health_port: 9091

logging:
  json: false
  level: warn
development: false

rtc_config:
  udp_port: 7895

cpu_cost: # Negative values to overcome CPU limits locally
  min_idle_ratio: 0.01
  rtmp_cpu_cost: -10
  whip_cpu_cost: -10
  whip_bypass_transcoding_cpu_cost: -10
  url_cpu_cost: -10
